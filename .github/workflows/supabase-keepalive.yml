name: Supabase keep-alive

# Free-tier Supabase pauses a project after 7 days without API calls, and the
# cached menu on Vercel hides that until it revalidates. A failed run emails the owner.
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read one cafe row
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          body=$(curl -sS --fail --max-time 20 --retry 3 --retry-delay 10 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/cafe?select=id&limit=1")
          case "$body" in
            "["*"id"*) echo "ok" ;;
            *) echo "unexpected response: $body"; exit 1 ;;
          esac
